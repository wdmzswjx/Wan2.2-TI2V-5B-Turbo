# Wan2.2Fun DMD distillation built on this repository's score-distillation framework.
# It uses trainer/wan22_distillation.py and model.Wan22FunDMD instead of a
# standalone external loop.

i2v: false
generator_fsdp_wrap_strategy: size
real_score_fsdp_wrap_strategy: size
fake_score_fsdp_wrap_strategy: size
real_name: Wan2.2-TI2V-5B
fake_name: Wan2.2-TI2V-5B
generator_type: bidirectional
generator_name: Wan2.2-TI2V-5B
text_encoder_fsdp_wrap_strategy: size
image_encoder_fsdp_wrap_strategy: size
text_encoder_cpu_offload: true

denoising_step_list:
- 1000
- 750
- 500
- 250
warp_denoising_step: true

ts_schedule: false
num_train_timestep: 1000
timestep_shift: 5.0
guidance_scale: 6.0
denoising_loss_type: x0
mixed_precision: true
seed: 0

wandb_host: WANDB_HOST
wandb_key: WANDB_KEY
wandb_entity: WANDB_ENTITY
wandb_project: WANDB_PROJECT
sharding_strategy: full
lr: 5.0e-07
lr_critic: 1.0e-07
beta1: 0.0
beta2: 0.999
beta1_critic: 0.0
beta2_critic: 0.999
batch_size: 1
ema_weight: 0.99
ema_start_step: 200
total_batch_size: 64
log_iters: 500

negative_prompt: '色调艳丽，过曝，静态，细节模糊不清，字幕，风格，作品，画作，画面，静止，整体发灰，最差质量，低质量，JPEG压缩残留，丑陋的，残缺的，多余的手指，画得不好的手部，画得不好的脸部，畸形的，毁容的，形态畸形的肢体，手指融合，静止不动的画面，杂乱的背景，三条腿，背景人很多，倒着走'
dfake_gen_update_ratio: 5
image_or_video_shape:
- 1
- 31
- 48
- 44
- 80
num_frames: 121
h: 704
w: 1280

# Select the new repo-native method.
distribution_loss: wan22fun
trainer: score_distillation_wan22fun
gradient_checkpointing: true
num_frame_per_block: 31
num_training_frames: 31
load_raw_video: false
model_kwargs:
  timestep_shift: 5.0
initial_step: 0

# Wan2.2Fun-specific conditioning policy.
wan22fun_zero_first_frame_timestep: true
wan22fun_mask_first_frame_loss: true

# Wan2.2Fun dataloader. Set train_data_meta/train_data_dir to your Wan2.2Fun
# metadata and data root. Metadata supports text/caption/prompt plus
# file_path/path/video_path/image_path and optional control_file_path/control_path.
use_wan22fun_dataloader: true
train_data_meta: data/3dgs_1110_with_skybox_fake/metadata.json
train_data_dir: .
video_sample_size: 704
image_sample_size: 704
video_sample_stride: 1
video_sample_n_frames: 121
video_repeat: 1
text_drop_ratio: 0.1
video_length_drop_start: 0.0
video_length_drop_end: 1.0
enable_bucket: true
random_hw_adapt: true
training_with_video_token_length: true
token_sample_size: 704
sample_n_frames_bucket_interval: 4
spatial_compression_ratio: 16
random_ratio_crop: false
fix_sample_size:
control_ref_image: first_frame
add_inpaint_info: false
enable_subject_info: false
dataloader_num_workers: 8
train_mode: control_ref
